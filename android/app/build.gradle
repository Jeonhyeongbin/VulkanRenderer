plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhb.vulkanrenderer'
    compileSdk 34

    defaultConfig {
        applicationId "com.jhb.vulkanrenderer"
        minSdk 24          // Android 7.0 - Vulkan 최소 지원 버전
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // 지원할 ABI 목록 (테스트용으로 arm64-v8a 먼저)
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // 셰이더 SPV 파일을 assets에 포함
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
